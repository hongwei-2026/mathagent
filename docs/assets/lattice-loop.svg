<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="img" aria-label="MathLattice wake sleep loop">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="920" height="480" rx="12" fill="#0f1419"/>
  <text x="40" y="40" fill="#e8eef5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">MathLattice loop</text>
  <text x="40" y="64" fill="#8b9bb0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">conjecture ’ typed memory ’ wake certify ’ sleep library · honest Gaps</text>

  <!-- center graph -->
  <rect x="300" y="160" width="320" height="160" rx="14" fill="#1e2d3d" stroke="#5b8def" stroke-width="2"/>
  <text x="460" y="200" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Research Graph</text>
  <text x="460" y="228" text-anchor="middle" fill="#c5d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Target · Conjecture · Lemma</text>
  <text x="460" y="248" text-anchor="middle" fill="#c5d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Gap · Concept · Plan</text>
  <text x="460" y="280" text-anchor="middle" fill="#8b9bb0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">only certified ’ Lemma</text>

  <!-- conjecture -->
  <rect x="340" y="90" width="240" height="44" rx="8" fill="#243447" stroke="#3d5a73"/>
  <text x="460" y="118" text-anchor="middle" fill="#fcd34d" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Conjecture pool</text>
  <line x1="460" y1="134" x2="460" y2="160" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- wake -->
  <rect x="40" y="190" width="200" height="100" rx="10" fill="#1a2e24" stroke="#86efac"/>
  <text x="140" y="225" text-anchor="middle" fill="#86efac" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">WAKE</text>
  <text x="140" y="250" text-anchor="middle" fill="#c5d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">econ / Lean / SymPy</text>
  <text x="140" y="270" text-anchor="middle" fill="#c5d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">call_op · or Gap</text>
  <line x1="240" y1="240" x2="300" y2="240" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="255" x2="240" y2="255" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- sleep -->
  <rect x="680" y="190" width="200" height="100" rx="10" fill="#2a2438" stroke="#c4b5fd"/>
  <text x="780" y="225" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">SLEEP</text>
  <text x="780" y="250" text-anchor="middle" fill="#c5d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">library_ops ’ Concept</text>
  <text x="780" y="270" text-anchor="middle" fill="#c5d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">gated · not fake lemmas</text>
  <line x1="620" y1="240" x2="680" y2="240" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="255" x2="620" y2="255" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- A-E strip -->
  <rect x="40" y="360" width="840" height="80" rx="10" fill="#1a2332" stroke="#3d5a73"/>
  <text x="60" y="390" fill="#e8eef5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Concept-value A’E</text>
  <text x="60" y="418" fill="#8b9bb0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Abduction ’ Concept slots ’ Analogy ’ Curator ’ Human gate (lattice-gate)</text>
</svg>
