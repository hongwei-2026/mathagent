[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathagent"
version = "0.1.0"
description = "Tool-integrated AI agent for mathematical reasoning (ToRA/MathChat inspired)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MathAgent Contributors" }]
dependencies = [
  "openai>=1.40.0",
  "sympy>=1.12",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
  "httpx>=0.27",
  "streamlit>=1.32",
  "datasets>=2.18",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mathagent = "mathagent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]